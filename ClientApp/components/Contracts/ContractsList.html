<v-container fluid class="page-container">
  <!-- Page Header -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12>
      <v-layout align-center>
        <v-flex xs12 sm6>
          <h1 class="display-1">إدارة العقود</h1>
          <p class="subheading grey--text">عرض وإدارة جميع العقود المسجلة</p>
        </v-flex>
        <v-flex xs12 sm6 class="text-left">
          <v-btn color="primary" large @click="addNewContract">
            <v-icon left>mdi-plus</v-icon>
            إضافة عقد جديد
          </v-btn>
        </v-flex>
      </v-layout>
    </v-flex>
  </v-layout>

  <!-- Search and Filters -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12>
      <v-card elevation="2">
        <v-card-text>
          <v-layout row wrap>
            <!-- Search -->
            <v-flex xs12 md6 class="pa-2">
              <v-text-field
                v-model="searchQuery"
                @input="search"
                label="البحث عن عقد"
                prepend-inner-icon="mdi-magnify"
                outlined
                clearable
                hide-details
              ></v-text-field>
            </v-flex>

            <!-- Contract Type Filter -->
            <v-flex xs12 sm4 md2 class="pa-2">
              <v-select
                v-model="selectedContractType"
                @change="applyFilters"
                :items="[
                  { text: 'كل الأنواع', value: 'all' },
                  { text: 'بيع', value: 'sale' },
                  { text: 'تأجير', value: 'rental' }
                ]"
                label="نوع العقد"
                outlined
                hide-details
              ></v-select>
            </v-flex>

            <!-- Asset Type Filter -->
            <v-flex xs12 sm4 md2 class="pa-2">
              <v-select
                v-model="selectedAssetType"
                @change="applyFilters"
                :items="[
                  { text: 'كل الأصول', value: 'all' },
                  { text: 'سيارة', value: 'car' },
                  { text: 'منزل', value: 'house' }
                ]"
                label="نوع الأصل"
                outlined
                hide-details
              ></v-select>
            </v-flex>

            <!-- Status Filter -->
            <v-flex xs12 sm4 md2 class="pa-2">
              <v-select
                v-model="selectedStatus"
                @change="applyFilters"
                :items="[
                  { text: 'كل الحالات', value: 'all' },
                  { text: 'نشط', value: 'active' },
                  { text: 'مكتمل', value: 'completed' },
                  { text: 'ملغي', value: 'cancelled' }
                ]"
                label="الحالة"
                outlined
                hide-details
              ></v-select>
            </v-flex>
          </v-layout>

          <v-layout row wrap class="mt-3">
            <v-flex xs12>
              <v-btn text color="primary" @click="clearFilters">
                <v-icon left>mdi-filter-remove</v-icon>
                إزالة الفلاتر
              </v-btn>
            </v-flex>
          </v-layout>
        </v-card-text>
      </v-card>
    </v-flex>
  </v-layout>

  <!-- Contracts Data Table -->
  <v-layout row wrap>
    <v-flex xs12>
      <v-card elevation="2">
        <v-data-table
          :headers="headers"
          :items="filteredContracts"
          :loading="loading"
          class="elevation-1"
          :items-per-page="10"
          :footer-props="{
            'items-per-page-text': 'عدد الصفوف',
            'items-per-page-all-text': 'الكل'
          }"
        >
          <!-- Contract Type -->
          <template v-slot:item.contractType="{ item }">
            <span :class="item.contractType === 'sale' ? 'status--text status--rounded status--green' : 'status--text status--rounded status--blue'">
              {{getContractTypeText(item.contractType)}}
            </span>
          </template>

          <!-- Asset Type -->
          <template v-slot:item.assetType="{ item }">
            <v-icon :color="item.assetType === 'car' ? 'primary' : 'info'">
              {{item.assetType === 'car' ? 'mdi-car' : 'mdi-home'}}
            </v-icon>
            {{getAssetTypeText(item.assetType)}}
          </template>

          <!-- Amount -->
          <template v-slot:item.amount="{ item }">
            {{formatAmount(item.amount)}}
          </template>

          <!-- Date -->
          <template v-slot:item.contractDate="{ item }">
            {{formatDate(item.contractDate)}}
          </template>

          <!-- Status -->
          <template v-slot:item.status="{ item }">
            <span :class="getStatusClass(item.status)">
              {{getStatusText(item.status)}}
            </span>
          </template>

          <!-- Actions -->
          <template v-slot:item.actions="{ item }">
            <v-btn icon @click="viewContract(item)">
              <v-icon color="primary">mdi-eye</v-icon>
            </v-btn>
            <v-btn icon @click="editContract(item)">
              <v-icon color="success">mdi-pencil</v-icon>
            </v-btn>
            <v-btn icon @click="confirmDelete(item)">
              <v-icon color="error">mdi-delete</v-icon>
            </v-btn>
          </template>

          <!-- Empty State -->
          <template v-slot:no-data>
            <div class="empty-state">
              <v-icon size="64" color="grey lighten-1">mdi-inbox</v-icon>
              <p class="title mt-4 grey--text">لا توجد عقود</p>
              <p class="body-1 grey--text">قم بإضافة عقد جديد للبدء</p>
              <v-btn color="primary" class="mt-4" @click="addNewContract">
                <v-icon left>mdi-plus</v-icon>
                إضافة عقد جديد
              </v-btn>
            </div>
          </template>
        </v-data-table>
      </v-card>
    </v-flex>
  </v-layout>

  <!-- Delete Confirmation Dialog -->
  <v-dialog v-model="deleteDialog" max-width="500">
    <v-card>
      <v-card-title class="headline error white--text">
        <v-icon left color="white">mdi-alert</v-icon>
        تأكيد الحذف
      </v-card-title>
      <v-card-text class="pa-4">
        <p class="body-1 mt-3">
          هل أنت متأكد من حذف هذا العقد؟
        </p>
        <p class="body-2 grey--text" v-if="contractToDelete">
          <strong>رقم العقد:</strong> {{contractToDelete.contractNumber}}<br>
          <strong>الأصل:</strong> {{contractToDelete.assetName}}
        </p>
        <p class="body-2 error--text">
          <v-icon small color="error">mdi-alert</v-icon>
          لا يمكن التراجع عن هذا الإجراء
        </p>
      </v-card-text>
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="deleteDialog = false">إلغاء</v-btn>
        <v-btn color="error" @click="deleteContract">حذف</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</v-container>
