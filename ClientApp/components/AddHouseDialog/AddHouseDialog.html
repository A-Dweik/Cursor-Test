<v-dialog v-model="show" max-width="800" persistent>
  <v-card>
    <v-card-title class="primary white--text">
      <span class="headline">{{ dialogTitle }}</span>
      <v-spacer></v-spacer>
      <v-btn icon @click="close">
        <v-icon color="white">mdi-close</v-icon>
      </v-btn>
    </v-card-title>

    <v-card-text class="pa-4">
      <v-form ref="form" v-model="valid">
        <v-layout row wrap>
          <!-- Title -->
          <v-flex xs12 class="pa-2">
            <v-text-field
              v-model="formData.title"
              label="عنوان العقار *"
              :rules="[rules.required]"
              outlined
              required
            ></v-text-field>
          </v-flex>

          <!-- Description -->
          <v-flex xs12 class="pa-2">
            <v-textarea
              v-model="formData.description"
              label="الوصف *"
              :rules="[rules.required]"
              outlined
              rows="3"
              required
            ></v-textarea>
          </v-flex>

          <!-- Location -->
          <v-flex xs12 sm6 class="pa-2">
            <v-text-field
              v-model="formData.location"
              label="الموقع *"
              :rules="[rules.required]"
              outlined
              prepend-inner-icon="mdi-map-marker"
              required
            ></v-text-field>
          </v-flex>

          <!-- Price -->
          <v-flex xs12 sm6 class="pa-2">
            <v-text-field
              v-model.number="formData.price"
              label="السعر (ريال/شهر) *"
              :rules="[rules.required, rules.number]"
              outlined
              type="number"
              prepend-inner-icon="mdi-currency-usd"
              required
            ></v-text-field>
          </v-flex>

          <!-- Bedrooms -->
          <v-flex xs12 sm4 class="pa-2">
            <v-text-field
              v-model.number="formData.bedrooms"
              label="عدد الغرف *"
              :rules="[rules.required, rules.number]"
              outlined
              type="number"
              prepend-inner-icon="mdi-bed"
              required
            ></v-text-field>
          </v-flex>

          <!-- Bathrooms -->
          <v-flex xs12 sm4 class="pa-2">
            <v-text-field
              v-model.number="formData.bathrooms"
              label="عدد الحمامات *"
              :rules="[rules.required, rules.number]"
              outlined
              type="number"
              prepend-inner-icon="mdi-shower"
              required
            ></v-text-field>
          </v-flex>

          <!-- Area -->
          <v-flex xs12 sm4 class="pa-2">
            <v-text-field
              v-model.number="formData.area"
              label="المساحة (م²) *"
              :rules="[rules.required, rules.number]"
              outlined
              type="number"
              prepend-inner-icon="mdi-ruler-square"
              required
            ></v-text-field>
          </v-flex>

          <!-- Status -->
          <v-flex xs12 sm6 class="pa-2">
            <v-select
              v-model="formData.status"
              :items="statusOptions"
              label="حالة العقار *"
              :rules="[rules.required]"
              outlined
              required
            ></v-select>
          </v-flex>

          <!-- Image URL -->
          <v-flex xs12 sm6 class="pa-2">
            <v-text-field
              v-model="formData.imageUrl"
              label="رابط الصورة"
              outlined
              prepend-inner-icon="mdi-image"
            ></v-text-field>
          </v-flex>

          <!-- Owner Name -->
          <v-flex xs12 sm6 class="pa-2">
            <v-text-field
              v-model="formData.ownerName"
              label="اسم المالك"
              outlined
              prepend-inner-icon="mdi-account"
            ></v-text-field>
          </v-flex>

          <!-- Owner Phone -->
          <v-flex xs12 sm6 class="pa-2">
            <v-text-field
              v-model="formData.ownerPhone"
              label="رقم جوال المالك"
              :rules="[rules.phone]"
              outlined
              prepend-inner-icon="mdi-phone"
              placeholder="05xxxxxxxx"
            ></v-text-field>
          </v-flex>

          <!-- Features -->
          <v-flex xs12 class="pa-2">
            <v-card outlined>
              <v-card-title class="subheading">
                المميزات
              </v-card-title>
              <v-card-text>
                <v-layout row wrap align-center>
                  <v-flex xs12 sm9 class="pa-1">
                    <v-text-field
                      v-model="featureInput"
                      label="أضف ميزة"
                      outlined
                      dense
                      hide-details
                      @keyup.enter="addFeature"
                    ></v-text-field>
                  </v-flex>
                  <v-flex xs12 sm3 class="pa-1">
                    <v-btn color="primary" @click="addFeature" block>
                      <v-icon left>mdi-plus</v-icon>
                      إضافة
                    </v-btn>
                  </v-flex>
                </v-layout>

                <v-layout row wrap class="mt-3">
                  <v-flex
                    v-for="(feature, index) in formData.features"
                    :key="index"
                    xs12
                    sm6
                    class="pa-1"
                  >
                    <v-chip close @click:close="removeFeature(index)" color="primary" outlined>
                      <v-icon left small>mdi-check</v-icon>
                      {{ feature }}
                    </v-chip>
                  </v-flex>
                </v-layout>

                <div v-if="!formData.features || formData.features.length === 0" class="text-center pa-4 grey--text">
                  لا توجد مميزات مضافة
                </div>
              </v-card-text>
            </v-card>
          </v-flex>
        </v-layout>
      </v-form>
    </v-card-text>

    <v-divider></v-divider>

    <v-card-actions class="pa-4">
      <v-spacer></v-spacer>
      <v-btn text large @click="close">
        إلغاء
      </v-btn>
      <v-btn
        color="primary"
        large
        :loading="loading"
        :disabled="!valid"
        @click="save"
      >
        <v-icon left>mdi-content-save</v-icon>
        {{ house ? 'تحديث' : 'حفظ' }}
      </v-btn>
    </v-card-actions>
  </v-card>
</v-dialog>
