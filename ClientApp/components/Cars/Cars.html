<v-container fluid class="page-container">
  <!-- Page Header -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12 sm8>
      <h1 class="display-1 mb-2">إدارة السيارات</h1>
      <p class="subheading grey--text">عرض وإدارة أسطول السيارات</p>
    </v-flex>
    <v-flex xs12 sm4 class="text-left">
      <v-btn color="primary" large @click="openAddDialog">
        <v-icon left>mdi-plus</v-icon>
        إضافة سيارة جديدة
      </v-btn>
    </v-flex>
  </v-layout>

  <!-- Search -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12>
      <v-text-field
        v-model="search"
        append-icon="mdi-magnify"
        label="بحث"
        single-line
        hide-details
        outlined
      ></v-text-field>
    </v-flex>
  </v-layout>

  <!-- Cars Table -->
  <v-card elevation="2">
    <v-data-table
      :headers="headers"
      :items="cars"
      :search="search"
      :loading="loading"
      loading-text="جاري التحميل..."
      no-data-text="لا توجد سيارات"
      :items-per-page="10"
      class="elevation-0"
    >
      <template v-slot:item.dailyRate="{ item }">
        {{ item.dailyRate }} ريال
      </template>

      <template v-slot:item.isAvailable="{ item }">
        <span :class="getStatusClasses(item.isAvailable)">
          {{ getStatusText(item.isAvailable) }}
        </span>
      </template>

      <template v-slot:item.actions="{ item }">
        <v-btn icon @click="openEditDialog(item)">
          <v-icon color="primary">mdi-pencil</v-icon>
        </v-btn>
        <v-btn icon @click="openDeleteDialog(item)">
          <v-icon color="error">mdi-delete</v-icon>
        </v-btn>
      </template>
    </v-data-table>
  </v-card>

  <!-- Add Car Dialog -->
  <v-dialog v-model="dialog" max-width="800px" persistent>
    <v-card>
      <v-card-title class="primary white--text">
        <span class="headline">إضافة سيارة جديدة</span>
      </v-card-title>

      <v-card-text class="pa-4">
        <v-form ref="form" v-model="valid">
          <v-layout row wrap>
            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.brand"
                label="الماركة"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.model"
                label="الموديل"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.year"
                label="السنة"
                type="number"
                :rules="[rules.required, rules.number]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.color"
                label="اللون"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.plateNumber"
                label="رقم اللوحة"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.dailyRate"
                label="السعر اليومي (ريال)"
                type="number"
                :rules="[rules.required, rules.number]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-select
                v-model="editedCar.fuelType"
                :items="['بنزين', 'ديزل', 'هايبرد', 'كهرباء']"
                label="نوع الوقود"
                outlined
              ></v-select>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-select
                v-model="editedCar.transmission"
                :items="['أوتوماتيك', 'عادي']"
                label="نوع القير"
                outlined
              ></v-select>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.seats"
                label="عدد المقاعد"
                type="number"
                outlined
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-checkbox
                v-model="editedCar.isAvailable"
                label="متاحة للإيجار"
              ></v-checkbox>
            </v-flex>

            <v-flex xs12 class="pa-2">
              <v-textarea
                v-model="editedCar.description"
                label="الوصف"
                outlined
                rows="3"
              ></v-textarea>
            </v-flex>
          </v-layout>
        </v-form>
      </v-card-text>

      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDialog">إلغاء</v-btn>
        <v-btn color="primary" @click="saveCar" :disabled="!valid">حفظ</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>

  <!-- Edit Car Dialog -->
  <v-dialog v-model="editDialog" max-width="800px" persistent>
    <v-card>
      <v-card-title class="primary white--text">
        <span class="headline">تعديل بيانات السيارة</span>
      </v-card-title>

      <v-card-text class="pa-4">
        <v-form ref="editForm" v-model="valid">
          <v-layout row wrap>
            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.brand"
                label="الماركة"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.model"
                label="الموديل"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.year"
                label="السنة"
                type="number"
                :rules="[rules.required, rules.number]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.color"
                label="اللون"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model="editedCar.plateNumber"
                label="رقم اللوحة"
                :rules="[rules.required]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.dailyRate"
                label="السعر اليومي (ريال)"
                type="number"
                :rules="[rules.required, rules.number]"
                outlined
                required
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-select
                v-model="editedCar.fuelType"
                :items="['بنزين', 'ديزل', 'هايبرد', 'كهرباء']"
                label="نوع الوقود"
                outlined
              ></v-select>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-select
                v-model="editedCar.transmission"
                :items="['أوتوماتيك', 'عادي']"
                label="نوع القير"
                outlined
              ></v-select>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-text-field
                v-model.number="editedCar.seats"
                label="عدد المقاعد"
                type="number"
                outlined
              ></v-text-field>
            </v-flex>

            <v-flex xs12 sm6 class="pa-2">
              <v-checkbox
                v-model="editedCar.isAvailable"
                label="متاحة للإيجار"
              ></v-checkbox>
            </v-flex>

            <v-flex xs12 class="pa-2">
              <v-textarea
                v-model="editedCar.description"
                label="الوصف"
                outlined
                rows="3"
              ></v-textarea>
            </v-flex>
          </v-layout>
        </v-form>
      </v-card-text>

      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDialog">إلغاء</v-btn>
        <v-btn color="primary" @click="updateCar" :disabled="!valid">تحديث</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>

  <!-- Delete Confirmation Dialog -->
  <v-dialog v-model="deleteDialog" max-width="500px">
    <v-card>
      <v-card-title class="headline">تأكيد الحذف</v-card-title>
      <v-card-text>
        هل أنت متأكد من حذف هذه السيارة؟
        <div v-if="carToDelete" class="mt-3">
          <strong>{{ carToDelete.brand }} {{ carToDelete.model }}</strong>
        </div>
      </v-card-text>
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDialog">إلغاء</v-btn>
        <v-btn color="error" @click="deleteCar">حذف</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</v-container>
