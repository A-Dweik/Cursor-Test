<v-container fluid class="page-container">
  <!-- Page Header -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12 sm8>
      <h1 class="display-1 mb-2">إدارة المنتجات</h1>
      <p class="subheading grey--text">إدارة مخزون الحليب واللحوم</p>
    </v-flex>
    <v-flex xs12 sm4 class="text-right">
      <v-btn color="primary" large @click="openAddDialog">
        <v-icon left>mdi-plus</v-icon>
        إضافة منتج
      </v-btn>
    </v-flex>
  </v-layout>

  <!-- Products Table -->
  <v-card elevation="2">
    <v-data-table
      :headers="headers"
      :items="products"
      :loading="loading"
      class="elevation-1"
      :items-per-page="10"
    >
      <template v-slot:item.type="{ item }">
        <v-icon :color="item.type === 'milk' ? 'blue' : 'red'" left>
          {{ item.type === 'milk' ? 'mdi-cup' : 'mdi-food-steak' }}
        </v-icon>
        {{ getTypeText(item.type) }}
      </template>

      <template v-slot:item.quantity="{ item }">
        <span :class="item.quantity < 10 ? 'error--text' : ''">
          {{ item.quantity }} {{ item.unit }}
        </span>
      </template>

      <template v-slot:item.pricePerUnit="{ item }">
        {{ item.pricePerUnit }} ريال
      </template>

      <template v-slot:item.status="{ item }">
        <span :class="getStatusClasses(item.status)">
          {{ getStatusText(item.status) }}
        </span>
      </template>

      <template v-slot:item.actions="{ item }">
        <v-btn icon @click="openEditDialog(item)">
          <v-icon color="primary">mdi-pencil</v-icon>
        </v-btn>
        <v-btn icon @click="deleteProduct(item)">
          <v-icon color="error">mdi-delete</v-icon>
        </v-btn>
      </template>
    </v-data-table>
  </v-card>

  <!-- Add/Edit Dialog -->
  <v-dialog v-model="showDialog" max-width="600px">
    <v-card>
      <v-card-title class="headline primary white--text">
        {{ editMode ? 'تعديل منتج' : 'إضافة منتج جديد' }}
      </v-card-title>

      <v-card-text class="pa-4">
        <v-form>
          <v-text-field
            v-model="currentProduct.name"
            label="اسم المنتج"
            outlined
            required
            class="mb-3"
          ></v-text-field>

          <v-select
            v-model="currentProduct.type"
            :items="[
              { text: 'حليب', value: 'milk' },
              { text: 'لحم', value: 'meat' }
            ]"
            label="نوع المنتج"
            outlined
            required
            class="mb-3"
          ></v-select>

          <v-text-field
            v-model.number="currentProduct.quantity"
            label="الكمية"
            outlined
            type="number"
            required
            class="mb-3"
          ></v-text-field>

          <v-text-field
            v-model="currentProduct.unit"
            label="الوحدة"
            outlined
            required
            class="mb-3"
            placeholder="مثال: لتر، كيلوجرام"
          ></v-text-field>

          <v-text-field
            v-model.number="currentProduct.pricePerUnit"
            label="السعر لكل وحدة (ريال)"
            outlined
            type="number"
            required
          ></v-text-field>
        </v-form>
      </v-card-text>

      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDialog">إلغاء</v-btn>
        <v-btn color="primary" @click="saveProduct">حفظ</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</v-container>
