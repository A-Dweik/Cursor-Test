<v-container fluid class="page-container">
  <!-- Page Header -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12 sm8 md9>
      <h1 class="display-1 mb-2" style="color: #1B8354">إدارة الهواتف</h1>
      <p class="subheading grey--text">إضافة وتعديل وحذف الهواتف المتاحة</p>
    </v-flex>
    <v-flex xs12 sm4 md3 class="text-left">
      <v-btn color="primary" large @click="openAddDialog">
        <v-icon left>mdi-plus</v-icon>
        إضافة هاتف جديد
      </v-btn>
    </v-flex>
  </v-layout>

  <!-- Search Bar -->
  <v-layout row wrap class="mb-4">
    <v-flex xs12 md8 lg6>
      <v-text-field
        v-model="searchQuery"
        label="بحث عن هاتف (العلامة التجارية، الموديل)"
        prepend-icon="mdi-magnify"
        outlined
        clearable
        @keyup.enter="searchPhones"
        @click:clear="loadPhones"
      >
        <template v-slot:append>
          <v-btn color="primary" @click="searchPhones" depressed>
            بحث
          </v-btn>
        </template>
      </v-text-field>
    </v-flex>
  </v-layout>

  <!-- Data Table -->
  <v-card elevation="2">
    <v-data-table
      :headers="headers"
      :items="phones"
      :loading="loading"
      loading-text="جاري التحميل..."
      no-data-text="لا توجد هواتف"
      class="elevation-1"
      :items-per-page="10"
      :footer-props="{
        'items-per-page-text': 'عدد الصفوف:',
        'items-per-page-all-text': 'الكل'
      }"
    >
      <!-- Price Column -->
      <template v-slot:item.price="{ item }">
        <span>{{ item.price }} ريال</span>
      </template>

      <!-- Status Column -->
      <template v-slot:item.inStock="{ item }">
        <v-chip
          :color="getStatusColor(item.inStock)"
          small
          dark
        >
          {{ getStatusText(item.inStock) }}
        </v-chip>
      </template>

      <!-- Actions Column -->
      <template v-slot:item.actions="{ item }">
        <v-btn icon @click="openEditDialog(item)">
          <v-icon color="primary">mdi-pencil</v-icon>
        </v-btn>
        <v-btn icon @click="openDeleteDialog(item)">
          <v-icon color="error">mdi-delete</v-icon>
        </v-btn>
      </template>
    </v-data-table>
  </v-card>

  <!-- Add/Edit Dialog -->
  <v-dialog v-model="dialog" max-width="600px" persistent>
    <v-card>
      <v-card-title class="primary white--text">
        <span class="headline">{{ formTitle }}</span>
      </v-card-title>

      <v-card-text class="pt-4">
        <v-form ref="form">
          <v-row>
            <v-col cols="12" md="6">
              <v-text-field
                v-model="editedItem.brand"
                label="العلامة التجارية"
                outlined
                required
                :rules="[v => !!v || 'العلامة التجارية مطلوبة']"
              ></v-text-field>
            </v-col>
            <v-col cols="12" md="6">
              <v-text-field
                v-model="editedItem.model"
                label="الموديل"
                outlined
                required
                :rules="[v => !!v || 'الموديل مطلوب']"
              ></v-text-field>
            </v-col>
          </v-row>

          <v-row>
            <v-col cols="12" md="4">
              <v-text-field
                v-model.number="editedItem.price"
                label="السعر (ريال)"
                outlined
                type="number"
                required
                :rules="[v => v > 0 || 'السعر يجب أن يكون أكبر من صفر']"
              ></v-text-field>
            </v-col>
            <v-col cols="12" md="4">
              <v-text-field
                v-model="editedItem.storage"
                label="التخزين"
                outlined
                placeholder="مثال: 128GB"
                required
              ></v-text-field>
            </v-col>
            <v-col cols="12" md="4">
              <v-text-field
                v-model="editedItem.ram"
                label="الرام"
                outlined
                placeholder="مثال: 8GB"
                required
              ></v-text-field>
            </v-col>
          </v-row>

          <v-row>
            <v-col cols="12" md="6">
              <v-text-field
                v-model="editedItem.color"
                label="اللون"
                outlined
                required
              ></v-text-field>
            </v-col>
            <v-col cols="12" md="6">
              <v-text-field
                v-model="editedItem.imageUrl"
                label="رابط الصورة (اختياري)"
                outlined
              ></v-text-field>
            </v-col>
          </v-row>

          <v-row>
            <v-col cols="12">
              <v-textarea
                v-model="editedItem.description"
                label="الوصف"
                outlined
                rows="3"
                required
              ></v-textarea>
            </v-col>
          </v-row>

          <v-row>
            <v-col cols="12">
              <v-switch
                v-model="editedItem.inStock"
                label="متوفر في المخزون"
                color="primary"
              ></v-switch>
            </v-col>
          </v-row>
        </v-form>
      </v-card-text>

      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDialog">
          إلغاء
        </v-btn>
        <v-btn color="primary" @click="savePhone">
          حفظ
        </v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>

  <!-- Delete Confirmation Dialog -->
  <v-dialog v-model="deleteDialog" max-width="400px">
    <v-card>
      <v-card-title class="headline error white--text">
        تأكيد الحذف
      </v-card-title>
      <v-card-text class="pt-4">
        <p class="body-1">
          هل أنت متأكد من حذف هذا الهاتف؟
        </p>
        <p class="body-2 grey--text" v-if="itemToDelete">
          <strong>{{ itemToDelete.brand }} {{ itemToDelete.model }}</strong>
        </p>
      </v-card-text>
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn text @click="closeDeleteDialog">
          إلغاء
        </v-btn>
        <v-btn color="error" @click="confirmDelete">
          حذف
        </v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</v-container>
