<div class="weather-wrapper">
    <h1 class="title">Today's Weather</h1>
    <div v-if="hasError" class="error">
        Unable to load weather data. Please try again later.
    </div>
    <div v-else-if="weather" class="card">
        <h2>{{ weather.city }}</h2>
        <p class="temp">{{ weather.temperatureC }}°C • {{ weather.condition }}</p>
        <ul>
            <li><strong>Humidity:</strong> {{ weather.humidity }}%</li>
            <li><strong>Wind:</strong> {{ weather.windSpeedKph }} km/h</li>
            <li><strong>Updated:</strong> {{ weather.lastUpdated }}</li>
        </ul>
    </div>
    <div v-else class="placeholder">
        Loading latest update...
    </div>
</div>
