<v-container fluid>
    <v-layout row wrap>
        <v-flex xs12>
            <v-card class="elevation-5 mx-auto" max-width="600">
                <v-toolbar color="primary" dark>
                    <v-toolbar-title>
                        <v-icon left>wb_sunny</v-icon>
                        Weather Application
                    </v-toolbar-title>
                </v-toolbar>

                <v-card-text>
                    <v-layout column>
                        <!-- City Selection -->
                        <v-flex xs12 class="mb-4">
                            <v-select
                                v-model="selectedCity"
                                :items="cities"
                                label="Select City"
                                outlined
                                @change="onCityChange"
                                prepend-icon="location_on"
                            ></v-select>
                        </v-flex>

                        <!-- Weather Display -->
                        <v-flex xs12 v-if="weatherData && !loading">
                            <v-card class="weather-card pa-4" outlined>
                                <v-layout column align-center>
                                    <div class="display-3 mb-2">
                                        {{ getWeatherIcon(weatherData.icon) }}
                                    </div>
                                    
                                    <h2 class="headline mb-2">{{ weatherData.city }}</h2>
                                    
                                    <div class="display-2 font-weight-bold mb-2">
                                        {{ weatherData.temperature }}°C
                                    </div>
                                    
                                    <div class="title text-capitalize mb-4">
                                        {{ weatherData.description }}
                                    </div>

                                    <v-divider class="my-3" style="width: 100%;"></v-divider>

                                    <!-- Weather Details -->
                                    <v-layout row wrap justify-center class="mt-3">
                                        <v-flex xs6 sm4 class="text-center pa-2">
                                            <v-icon color="info">opacity</v-icon>
                                            <div class="caption">Humidity</div>
                                            <div class="subheading font-weight-bold">
                                                {{ weatherData.humidity }}%
                                            </div>
                                        </v-flex>
                                        
                                        <v-flex xs6 sm4 class="text-center pa-2">
                                            <v-icon color="info">air</v-icon>
                                            <div class="caption">Wind Speed</div>
                                            <div class="subheading font-weight-bold">
                                                {{ weatherData.windSpeed }} km/h
                                            </div>
                                        </v-flex>
                                    </v-layout>
                                </v-layout>
                            </v-card>
                        </v-flex>

                        <!-- Loading State -->
                        <v-flex xs12 v-if="loading" class="text-center py-5">
                            <v-progress-circular
                                indeterminate
                                color="primary"
                                size="50"
                            ></v-progress-circular>
                            <div class="mt-3">Loading weather data...</div>
                        </v-flex>
                    </v-layout>
                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn color="primary" @click="loadWeather" :loading="loading">
                        <v-icon left>refresh</v-icon>
                        Refresh
                    </v-btn>
                </v-card-actions>
            </v-card>
        </v-flex>
    </v-layout>
</v-container>
